<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Czysty Test Niimbot</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; text-align: center; }
    button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; }
    #btnConnect { background: #2563eb; color: white; }
    #btnPrint { background: #16a34a; color: white; }
    #btnPrint:disabled { background: #555; cursor: not-allowed; }
    input { padding: 12px; font-size: 18px; width: 80%; max-width: 300px; text-align: center; margin-bottom: 10px; }
    #canvas { background: white; margin: 20px auto; display: block; border: 2px solid #555; }
    #log { text-align: left; background: #000; color: #0f0; padding: 10px; font-family: monospace; height: 200px; overflow-y: scroll; font-size: 12px; }
  </style>
</head>
<body>

  <h2>TEST DRUKARKI (CZYSTE KONTO)</h2>
  
  <button id="btnConnect">1. POŁĄCZ</button>
  <br>
  
  <input type="text" id="textInput" value="TEST 123">
  <br>
  
  <button id="btnPrint" disabled>2. DRUKUJ NAPIS</button>

  <canvas id="canvas" width="384" height="200"></canvas>

  <div id="log">Czekam na start...</div>

  <!-- Ładujemy czysty moduł ESM, tak jak w nowym Vue/Vite -->
  <script type="module">
    import * as niimblue from 'https://cdn.jsdelivr.net/npm/@mmote/niimbluelib@latest/+esm';

    let printerClient = null;

    function logger(msg) {
      const logBox = document.getElementById('log');
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 1. ŁĄCZENIE
    document.getElementById('btnConnect').onclick = async () => {
      try {
        logger("Inicjalizacja klienta...");
        printerClient = new niimblue.NiimbotBluetoothClient();
        
        logger("Szukanie Bluetooth...");
        await printerClient.connect();
        
        logger("Pobieranie info z drukarki...");
        await printerClient.fetchPrinterInfo();
        
        const info = printerClient.getPrinterInfo();
        logger(`✅ POŁĄCZONO! Model: ${info?.modelName}`);
        logger(`Wykryty silnik: ${printerClient.getPrintTaskType()}`);
        
        document.getElementById('btnPrint').disabled = false;
      } catch (err) {
        logger("❌ Błąd połączenia: " + err.message);
      }
    };

    // 2. DRUKOWANIE
    document.getElementById('btnPrint').onclick = async () => {
      try {
        const text = document.getElementById('textInput').value;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        logger("Rysowanie na canvas...");
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "black";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText(text, 20, 100);

        logger("Kodowanie obrazu...");
        const encoded = niimblue.ImageEncoder.encodeCanvas(canvas);
        
        // Dynamicznie wyciągamy task type i szukamy odpowiedniej klasy w module
        const taskTypeName = printerClient.getPrintTaskType() || "B21V1";
        const TaskClass = niimblue[taskTypeName + "PrintTask"];
        
        logger(`Tworzenie zadania: ${taskTypeName}PrintTask`);
        
        if (!TaskClass) {
            throw new Error(`Brak klasy ${taskTypeName}PrintTask w module!`);
        }

        const printTask = new TaskClass(printerClient, {
          totalPages: 1,
          labelType: 3 // 3 = Continuous (Rolka ciągła)
        });

        logger("Inicjalizacja głowicy...");
        await printTask.printInit();

        logger("Wysyłanie danych do wydruku...");
        // Wysłanie z opcją 1 (jedna kopia). Żadnego ruszania kolorów.
        await printTask.printPage(encoded, 1);

        logger("Oczekiwanie na koniec...");
        await printTask.waitForFinished();
        
        logger("✅ WYDRUKOWANO!");
        
        await printerClient.printEnd().catch(() => {});
      } catch (err) {
        logger("❌ BŁĄD DRUKU: " + err.message);
        
        // Zrzut awaryjny obieków, żebyśmy widzieli w logach co się kryje w środku
        if (err.message.includes("sendAll")) {
            logger("Szczegóły obiektu: " + Object.keys(printerClient).join(", "));
        }
      }
    };
  </script>
</body>
</html>
