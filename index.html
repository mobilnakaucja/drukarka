<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Czysty Test Niimbot B3S-P</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; text-align: center; }
    button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; }
    #btnConnect { background: #2563eb; color: white; }
    #btnPrint { background: #16a34a; color: white; }
    #btnPrint:disabled { background: #555; cursor: not-allowed; }
    input { padding: 12px; font-size: 18px; width: 80%; max-width: 300px; text-align: center; margin-bottom: 10px; }
    #canvas { background: white; margin: 20px auto; display: block; border: 2px solid #555; }
    #log { text-align: left; background: #000; color: #0f0; padding: 10px; font-family: monospace; height: 250px; overflow-y: scroll; font-size: 12px; }
  </style>
</head>
<body>

  <h2>TEST DRUKARKI B3S_P (KNEBEL)</h2>
  
  <button id="btnConnect">1. POŁĄCZ</button>
  <br>
  
  <input type="text" id="textInput" value="TEST B3S-P">
  <br>
  
  <button id="btnPrint" disabled>2. DRUKUJ NAPIS</button>

  <canvas id="canvas" width="384" height="200"></canvas>

  <div id="log">Gotowy do akcji...</div>

  <script type="module">
    import * as niimblue from 'https://cdn.jsdelivr.net/npm/@mmote/niimbluelib@latest/+esm';

    let printerClient = null;

    function logger(msg) {
      const logBox = document.getElementById('log');
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 1. ŁĄCZENIE
    document.getElementById('btnConnect').onclick = async () => {
      try {
        logger("Inicjalizacja klienta...");
        printerClient = new niimblue.NiimbotBluetoothClient();
        
        logger("Szukanie Bluetooth...");
        await printerClient.connect();
        
        await printerClient.fetchPrinterInfo().catch(() => {});
        
        const info = printerClient.getPrinterInfo();
        logger(`✅ POŁĄCZONO! Sprzęt: ${info?.modelName || 'B3S_P (Wymuszony)'}`);
        
        // ŁATKA 1: Protokół wysyłania (sprawdzona, działała w poprzednim logu)
        if (typeof printerClient.sendAll !== "function") {
            logger("Łatanie protokołu Bluetooth...");
            printerClient.sendAll = async function(packets) {
                if (!Array.isArray(packets)) packets = [packets];
                for (let pkt of packets) {
                    if (typeof this.sendPacket === "function") await this.sendPacket(pkt);
                    else if (this.channel && typeof this.channel.send === "function") await this.channel.send(pkt);
                    await new Promise(r => setTimeout(r, 10)); 
                }
            };
        }
        
        document.getElementById('btnPrint').disabled = false;
      } catch (err) {
        logger("❌ Błąd połączenia: " + err.message);
      }
    };

    // 2. DRUKOWANIE
    document.getElementById('btnPrint').onclick = async () => {
      try {
        const text = document.getElementById('textInput').value;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        logger("Rysowanie na canvas (czysty B&W)...");
        ctx.fillStyle = "white"; // Tło w 100% białe, zgodnie z manualem
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "black"; // Tekst w 100% czarny
        ctx.font = "bold 40px sans-serif";
        ctx.fillText(text, 20, 100);

        logger("Kodowanie obrazu...");
        const encoded = niimblue.ImageEncoder.encodeCanvas(canvas);
        
        // ŁATKA 2: Definiujemy TWARDY kolor obrazu omijając blokady zapisu
        try {
            Object.defineProperty(encoded, 'color', { value: 'black', writable: true, configurable: true, enumerable: true });
        } catch(e) {
            encoded.color = 'black';
        }

        logger(`Tworzenie zadania dla silnika B21V1...`);
        const TaskClass = niimblue.B21V1PrintTask;
        
        const printTask = new TaskClass(printerClient, {
          totalPages: 1,
          labelType: 3 // Rolka ciągła (dla etykiet ButelkoBusa)
        });

        // ŁATKA 3 (NUKLEARNA): Kasujemy funkcje walidujące BEZPOŚREDNIO w obiekcie
        // Przeszukujemy obiekt i jego prototyp i podmieniamy wszystkie funkcje 
        // sprawdzające "kolor" na takie, które mówią "Wszystko jest w porządku, drukuj".
        let objToHack = printTask;
        while (objToHack) {
            for (const key of Object.getOwnPropertyNames(objToHack)) {
                if (typeof objToHack[key] === 'function' && key.toLowerCase().includes('color')) {
                    objToHack[key] = function() { return true; };
                }
            }
            objToHack = Object.getPrototypeOf(objToHack);
        }
        
        // Brutalny knebel bezpośrednio (dla pewności)
        printTask.supportColor = function() { return true; };
        printTask.isSupportedColor = function() { return true; };

        logger("Inicjalizacja głowicy (printInit)...");
        await printTask.printInit();

        logger("Wysyłanie pikseli do grzałki...");
        await printTask.printPage(encoded, 1);

        logger("Oczekiwanie na koniec...");
        await printTask.waitForFinished();
        
        logger("✅ WYDRUKOWANO!");
      } catch (err) {
        logger("❌ BŁĄD DRUKU: " + err.message);
      } finally {
        if (printerClient && typeof printerClient.printEnd === 'function') {
           await printerClient.printEnd().catch(() => {});
        }
      }
    };
  </script>
</body>
</html>
