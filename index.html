<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Czysty Test Niimbot</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; text-align: center; }
    button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; font-weight: bold; border: none; border-radius: 8px; }
    #btnConnect { background: #2563eb; color: white; }
    #btnPrint { background: #16a34a; color: white; }
    #btnPrint:disabled { background: #555; cursor: not-allowed; }
    input { padding: 12px; font-size: 18px; width: 80%; max-width: 300px; text-align: center; margin-bottom: 10px; }
    #canvas { background: white; margin: 20px auto; display: block; border: 2px solid #555; }
    #log { text-align: left; background: #000; color: #0f0; padding: 10px; font-family: monospace; height: 250px; overflow-y: scroll; font-size: 12px; }
  </style>
</head>
<body>

  <h2>TEST DRUKARKI (CZYSTE KONTO 2.0)</h2>
  
  <button id="btnConnect">1. POŁĄCZ</button>
  <br>
  
  <input type="text" id="textInput" value="TEST BUTELKOBUS">
  <br>
  
  <button id="btnPrint" disabled>2. DRUKUJ NAPIS</button>

  <canvas id="canvas" width="384" height="200"></canvas>

  <div id="log">Czekam na start...</div>

  <script type="module">
    import * as niimblue from 'https://cdn.jsdelivr.net/npm/@mmote/niimbluelib@latest/+esm';

    let printerClient = null;

    function logger(msg) {
      const logBox = document.getElementById('log');
      logBox.innerText += "\n" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 1. ŁĄCZENIE
    document.getElementById('btnConnect').onclick = async () => {
      try {
        logger("Inicjalizacja klienta...");
        printerClient = new niimblue.NiimbotBluetoothClient();
        
        logger("Szukanie Bluetooth...");
        await printerClient.connect();
        
        logger("Pobieranie info z drukarki...");
        await printerClient.fetchPrinterInfo().catch(() => logger("Ostrzeżenie: Drukarka milczy przy info."));
        
        const info = printerClient.getPrinterInfo();
        logger(`✅ POŁĄCZONO! Model: ${info?.modelName || 'Nieznany (Wymuszamy B3S)'}`);
        
        // --- KLUCZOWA ŁATKA KOMUNIKACJI (MONKEY PATCH) ---
        if (typeof printerClient.sendAll !== "function") {
            logger("Wstrzykiwanie naprawionego protokołu wysyłania (sendAll)...");
            printerClient.sendAll = async function(packets) {
                if (!Array.isArray(packets)) packets = [packets];
                for (let pkt of packets) {
                    // Znajdujemy prawdziwą, ukrytą funkcję wysyłającą
                    if (typeof this.sendPacket === "function") {
                        await this.sendPacket(pkt);
                    } else if (this.channel && typeof this.channel.send === "function") {
                        await this.channel.send(pkt);
                    } else {
                        throw new Error("Krytyczny brak kanału wysyłania (channel.send)!");
                    }
                    // Bluetooth nie lubi pośpiechu
                    await new Promise(r => setTimeout(r, 10)); 
                }
            };
        }
        
        document.getElementById('btnPrint').disabled = false;
      } catch (err) {
        logger("❌ Błąd połączenia: " + err.message);
      }
    };

    // 2. DRUKOWANIE
    document.getElementById('btnPrint').onclick = async () => {
      // Zapisujemy oryginalną funkcję tablicy przed jej wyłączeniem
      const origIncludes = Array.prototype.includes;

      try {
        const text = document.getElementById('textInput').value;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        logger("Rysowanie na canvas...");
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "black";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText(text, 20, 100);

        logger("Kodowanie obrazu...");
        const encoded = niimblue.ImageEncoder.encodeCanvas(canvas);
        encoded.color = "black";
        
        logger(`Tworzenie zadania dla silnika B21V1...`);
        const TaskClass = niimblue.B21V1PrintTask;
        
        const printTask = new TaskClass(printerClient, {
          totalPages: 1,
          labelType: 3 // 3 = Rolka ciągła
        });

        // --- KLUCZOWA ŁATKA KOLORU (NUKLEARNA) ---
        // Ponieważ drukarka nie podała swojego modelu, tablica dozwolonych kolorów jest pusta.
        // Oślepiamy przeglądarkę, żeby przepuściła czarny kolor mimo wszystko.
        Array.prototype.includes = function(val) {
           if (val === 'black' || val === undefined || val === 1) return true;
           return origIncludes.apply(this, arguments);
        };

        if (typeof printTask.isColorSupported === 'function') printTask.isColorSupported = () => true;
        if (typeof printTask.isSupportedColor === 'function') printTask.isSupportedColor = () => true;

        logger("Inicjalizacja głowicy (printInit)...");
        await printTask.printInit();

        logger("Wysyłanie pikseli do grzałki...");
        await printTask.printPage(encoded, 1);

        logger("Oczekiwanie na koniec...");
        await printTask.waitForFinished();
        
        logger("✅ WYDRUKOWANO!");
      } catch (err) {
        logger("❌ BŁĄD DRUKU: " + err.message);
      } finally {
        // Zawsze przywracamy pamięć przeglądarce
        Array.prototype.includes = origIncludes;
        if (printerClient && typeof printerClient.printEnd === 'function') {
           await printerClient.printEnd().catch(() => {});
        }
      }
    };
  </script>
</body>
</html>
